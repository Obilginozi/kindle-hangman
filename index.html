<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Adam Asmaca</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body { padding: 8px; font-family: sans-serif; }
  h1 { font-size: 26px; font-weight: bold; text-align: center; margin: 4px 0; }
  p { margin: 4px 0; }
  p.offline { font-weight: bold; font-size: 16px; text-align: center; margin: 2px 0 8px; }
  button, input.word {
    -webkit-appearance: none;
    appearance: none;
    display: block;
    width: 100%;
    min-height: 44px;
    margin: 8px 0;
    padding: 8px;
    font-size: 18px;
    font-family: sans-serif;
    background: #fff;
    color: #000;
    border: 2px solid #000;
    border-radius: 0;
  }
  button.on { background: #000; color: #fff; }
  .meta { text-align: center; font-size: 16px; }
  .err { min-height: 1.2em; font-size: 16px; text-align: center; }
  .wrap { max-width: 720px; margin: 0 auto; }
  table.head { width: 100%; border-collapse: collapse; margin: 0 0 4px; }
  table.head td { vertical-align: middle; padding: 0; }
  td.hspacer { width: 30%; }
  td.htitle { width: 40%; text-align: center; }
  td.hlang { width: 30%; text-align: right; }
  table.head h1 { text-align: center; font-size: 22px; margin: 0; }
  table.langs { margin-left: auto; border-collapse: separate; border-spacing: 6px 0; }
  table.langs td { width: auto; padding: 0; }
  table.langs button {
    width: auto;
    min-width: 46px;
    min-height: 0;
    height: 32px;
    margin: 0;
    padding: 0 8px;
    font-size: 14px;
  }
  table.gal { border-collapse: collapse; margin: 4px auto 8px; }
  table.gal td { padding: 0; background: #fff; vertical-align: top; text-align: center; }
  table.gal td.wing { width: 52px; background: #fff; }
  table.gal td.post { width: 16px; background: #000; }
  table.gal td.beam { height: 16px; background: #000; }
  table.gal td.side { width: 58px; background: #fff; }
  table.gal td.mid { width: 56px; position: relative; background: #fff; }
  table.gal td.rope { height: 28px; }
  div.noose { width: 4px; height: 28px; background: #000; margin: 0 auto; }
  div.face {
    width: 52px;
    height: 52px;
    margin: 0 auto;
    border: 4px solid #fff;
    border-radius: 50%;
    box-sizing: border-box;
  }
  div.face.on { border-color: #000; }
  table.gal td.body { height: 72px; }
  div.torso { width: 4px; height: 72px; margin: 0 auto; background: #fff; }
  div.torso.on { background: #000; }
  div.arm, div.leg { position: absolute; height: 4px; background: #fff; }
  div.arm.on, div.leg.on { background: #000; }
  div.arm { width: 52px; top: 2px; }
  div.arm.l, div.leg.l {
    right: 24px;
    -webkit-transform-origin: right center;
    transform-origin: right center;
  }
  div.arm.r, div.leg.r {
    left: 24px;
    -webkit-transform-origin: left center;
    transform-origin: left center;
  }
  div.arm.l { -webkit-transform: rotate(-42deg); transform: rotate(-42deg); }
  div.arm.r { -webkit-transform: rotate(42deg); transform: rotate(42deg); }
  table.gal td.hip { height: 64px; }
  div.leg { width: 54px; top: -2px; }
  div.leg.l { -webkit-transform: rotate(-50deg); transform: rotate(-50deg); }
  div.leg.r { -webkit-transform: rotate(50deg); transform: rotate(50deg); }
  table.gal td.ground { height: 16px; background: #000; }
  table.word { margin: 8px auto; border-collapse: separate; border-spacing: 4px; }
  table.word td {
    width: 32px;
    height: 40px;
    border: 2px solid #000;
    text-align: center;
    vertical-align: middle;
    font-size: 22px;
    font-weight: bold;
    padding: 0;
  }
  table.pad { width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: 3px; margin: 8px 0; }
  table.pad td { padding: 0; }
  table.pad button { margin: 0; min-height: 0; height: 36px; padding: 0; font-size: 16px; }
  .block { border: 2px solid #000; padding: 12px; margin: 12px 0; text-align: center; }
  .block .big { font-size: 28px; font-weight: bold; letter-spacing: 2px; }
  #flash { display: none; background: #fff; height: 2400px; }
</style>
</head>
<body>
<div id="flash"></div>
<div id="app" class="wrap"></div>
<script>
(function () {
  'use strict';

  var KEY = 'kindleHangman.v1';
  var MAX = 6;
  var ABC = {
    tr: 'ABCÇDEFGĞHIİJKLMNOÖPRSŞTUÜVYZ',
    en: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'
  };
  var KEYS = {
    tr: ['QWERTYUIOPĞÜ', 'ASDFGHJKLŞİ', 'ZXCVBNMÖÇ'],
    en: ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM']
  };
  var STR = {
    tr: {
      title: 'Adam Asmaca',
      newGame: 'Yeni oyun',
      refresh: 'Ekranı tazele',
      ready: 'Çevrimdışı hazır. Uçak modunu açın.',
      flying: 'Uçak modu açık. Çevrimdışı oynuyorsunuz.',
      wait: 'Sayfa bir kez kalsın, sonra uçak modunu açın.',
      wordTitle: 'Kelime',
      wordHelp: 'Kelimeyi yazın. Harfler gizlenir, sonra tahmin başlar.',
      alphabet: 'Alfabe: Türkçe',
      start: 'Oyuna geç',
      needWord: 'En az 2 harf yazın.',
      longWord: 'En fazla 16 harf.',
      badLetter: 'Seçili alfabede olmayan bir harf var.',
      back: 'Geri',
      menu: 'Menü',
      mistakes: 'Hata',
      win: 'Bildiniz',
      lose: 'Bilemediniz',
      again: 'Yeni kelime',
      home: 'Ana sayfa',
      theWord: 'Kelime'
    },
    en: {
      title: 'Hangman',
      newGame: 'New game',
      refresh: 'Refresh screen',
      ready: 'Offline ready. Turn on airplane mode.',
      flying: 'Airplane mode is on. Playing offline.',
      wait: 'Leave this page open once, then turn on airplane mode.',
      wordTitle: 'Word',
      wordHelp: 'Enter the word. The letters stay hidden, then guessing starts.',
      alphabet: 'Alphabet: English',
      start: 'Start',
      needWord: 'Enter at least 2 letters.',
      longWord: '16 letters at most.',
      badLetter: 'A letter is outside the selected alphabet.',
      back: 'Back',
      menu: 'Menu',
      mistakes: 'Wrong',
      win: 'Solved',
      lose: 'Not solved',
      again: 'New word',
      home: 'Home',
      theWord: 'Word'
    }
  };

  var state;
  var view = '';
  var secret = '';
  var revealed = [];
  var cells = [];
  var guessed = {};
  var mistakes = 0;
  var offlineBound = false;

  function L() {
    return STR[state.lang] || STR.tr;
  }

  function langCode() {
    return state.lang === 'en' ? 'en' : 'tr';
  }

  function load() {
    var raw;
    state = { lang: '' };
    try {
      raw = localStorage.getItem(KEY);
      if (raw) {
        raw = JSON.parse(raw);
        if (raw && (raw.lang === 'tr' || raw.lang === 'en')) state.lang = raw.lang;
      }
    } catch (e) {}
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify({ lang: state.lang === 'en' ? 'en' : 'tr' }));
    } catch (e) {}
  }

  function setLangAttr() {
    document.documentElement.lang = langCode();
    document.title = L().title;
  }

  function byId(id) {
    return document.getElementById(id);
  }

  function setApp(html) {
    document.getElementById('app').innerHTML = html;
    watchOffline();
  }

  function offlineHtml() {
    return '<p id="offline" class="offline"></p>';
  }

  function offlineText() {
    var lang = state.lang === 'en' ? STR.en : STR.tr;
    var online = true;
    var ready = false;
    try {
      if (navigator.onLine === false) online = false;
    } catch (e1) {}
    try {
      ready = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
    } catch (e2) {}
    if (!online) return lang.flying;
    if (location.protocol === 'file:' || ready) return lang.ready;
    return lang.wait;
  }

  function watchOffline() {
    var el = byId('offline');
    if (!el) return;
    el.textContent = offlineText();
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.ready && navigator.serviceWorker.ready.then) {
        navigator.serviceWorker.ready.then(function () {
          var node = byId('offline');
          if (node) node.textContent = offlineText();
        });
      }
    } catch (e3) {}
  }

  function trUpper(s) {
    var map = langCode() === 'tr'
      ? { 'i': 'İ', 'ı': 'I', 'ç': 'Ç', 'ğ': 'Ğ', 'ö': 'Ö', 'ş': 'Ş', 'ü': 'Ü' }
      : { 'i': 'I', 'ı': 'I', 'ç': 'Ç', 'ğ': 'Ğ', 'ö': 'Ö', 'ş': 'Ş', 'ü': 'Ü' };
    var out = '';
    var i, ch;
    s = String(s || '');
    for (i = 0; i < s.length; i++) {
      ch = s.charAt(i);
      if (map[ch]) out += map[ch];
      else out += ch.toUpperCase();
    }
    return out;
  }

  function headHtml() {
    var lang = L();
    var html = '';
    html += '<table class="head"><tbody><tr>';
    html += '<td class="hspacer"></td>';
    html += '<td class="htitle"><h1>' + lang.title + '</h1></td>';
    html += '<td class="hlang"><table class="langs"><tbody><tr>';
    html += '<td><button type="button" id="tr">TR</button></td>';
    html += '<td><button type="button" id="en">EN</button></td>';
    html += '</tr></tbody></table></td>';
    html += '</tr></tbody></table>';
    return html;
  }

  function bindLang() {
    byId('tr').onclick = function () { chooseLang('tr'); };
    byId('en').onclick = function () { chooseLang('en'); };
    if (state.lang === 'en') byId('en').className = 'on';
    else byId('tr').className = 'on';
  }

  function chooseLang(code) {
    state.lang = code === 'en' ? 'en' : 'tr';
    setLangAttr();
    save();
    if (view === 'word') showWord();
    else showHome();
  }

  function flash() {
    var app = byId('app');
    var panel = byId('flash');
    app.style.display = 'none';
    panel.style.display = 'block';
    setTimeout(function () {
      panel.style.display = 'none';
      app.style.display = 'block';
    }, 280);
  }

  function showHome() {
    var lang = L();
    var html = '';
    view = 'home';
    secret = '';
    setLangAttr();
    html += headHtml();
    html += offlineHtml();
    html += '<button type="button" id="new">' + lang.newGame + '</button>';
    html += '<button type="button" id="flashBtn">' + lang.refresh + '</button>';
    setApp(html);
    bindLang();
    byId('new').onclick = showWord;
    byId('flashBtn').onclick = flash;
  }

  function showWord() {
    var lang = L();
    var html = '';
    view = 'word';
    secret = '';
    setLangAttr();
    html += headHtml();
    html += '<p class="meta">' + lang.wordHelp + '</p>';
    html += '<p class="meta">' + lang.alphabet + '</p>';
    html += '<input id="secret" class="word" type="password" maxlength="16" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">';
    html += '<p id="err" class="err"></p>';
    html += '<button type="button" id="go">' + lang.start + '</button>';
    html += '<button type="button" id="back">' + lang.back + '</button>';
    setApp(html);
    bindLang();
    byId('go').onclick = submitWord;
    byId('back').onclick = showHome;
    byId('secret').onkeydown = function (e) {
      var code = e.keyCode || e.which || 0;
      if (code === 13 || e.key === 'Enter') {
        if (e.preventDefault) e.preventDefault();
        submitWord();
      }
    };
  }

  function checkWord(raw) {
    var lang = L();
    var abc = ABC[langCode()];
    var up = trUpper(raw);
    var i, ch;
    up = up.replace(/^\s+/, '').replace(/\s+$/, '');
    if (up.length < 2) return { error: lang.needWord };
    if (up.length > 16) return { error: lang.longWord };
    for (i = 0; i < up.length; i++) {
      ch = up.charAt(i);
      if (abc.indexOf(ch) < 0) return { error: lang.badLetter };
    }
    return { word: up };
  }

  function submitWord() {
    var input = byId('secret');
    var result = checkWord(input ? input.value : '');
    if (result.error) {
      byId('err').textContent = result.error;
      return;
    }
    begin(result.word);
  }

  function piece(cls, on) {
    return '<div class="' + cls + (on ? ' on' : '') + '"></div>';
  }

  function gallowsHtml(n) {
    var h = '';
    h += '<table class="gal"><tbody>';
    h += '<tr><td class="wing"></td><td class="post"></td><td class="beam" colspan="3"></td></tr>';
    h += '<tr><td class="wing"></td><td class="post"></td><td class="side"></td><td class="mid rope"><div class="noose"></div></td><td class="side"></td></tr>';
    h += '<tr><td class="wing"></td><td class="post"></td><td class="side"></td><td class="mid">' + piece('face', n >= 1) + '</td><td class="side"></td></tr>';
    h += '<tr><td class="wing"></td><td class="post"></td><td class="side"></td><td class="mid body">';
    h += piece('torso', n >= 2);
    h += piece('arm l', n >= 3);
    h += piece('arm r', n >= 4);
    h += '</td><td class="side"></td></tr>';
    h += '<tr><td class="wing"></td><td class="post"></td><td class="side"></td><td class="mid hip">';
    h += piece('leg l', n >= 5);
    h += piece('leg r', n >= 6);
    h += '</td><td class="side"></td></tr>';
    h += '<tr><td class="ground"></td><td class="ground"></td><td class="ground" colspan="3"></td></tr>';
    h += '</tbody></table>';
    return h;
  }

  function begin(word) {
    var i;
    secret = word;
    revealed = [];
    cells = [];
    guessed = {};
    mistakes = 0;
    for (i = 0; i < secret.length; i++) revealed.push(0);
    showGame();
  }

  function keyAlphabet() {
    return KEYS[langCode()].join('');
  }

  function letterTable() {
    var rows = KEYS[langCode()];
    var html = '<table class="pad"><tbody>';
    var grid = rows[0].length * 2;
    var r, i, ch, row, lead, used, rest;
    for (r = 0; r < rows.length; r++) {
      row = rows[r];
      lead = r === 0 ? 0 : (r === 1 ? 1 : 3);
      html += '<tr>';
      if (lead) html += '<td colspan="' + lead + '"></td>';
      for (i = 0; i < row.length; i++) {
        ch = row.charAt(i);
        html += '<td colspan="2"><button type="button" data-l="' + ch + '">' + ch + '</button></td>';
      }
      used = lead + row.length * 2;
      rest = grid - used;
      if (rest > 0) html += '<td colspan="' + rest + '"></td>';
      html += '</tr>';
    }
    html += '</tbody></table>';
    return html;
  }

  function showGame() {
    var lang = L();
    var html = '';
    var table, tbody, tr, td, i, col;
    view = 'game';
    html += '<table class="head"><tbody><tr>';
    html += '<td class="htitle"><h1>' + lang.title + '</h1></td>';
    html += '<td class="hlang"><p id="miss" class="meta"></p></td>';
    html += '</tr></tbody></table>';
    html += '<div id="fig"></div>';
    html += '<div id="wordwrap"></div>';
    html += letterTable();
    html += '<button type="button" id="menu">' + lang.menu + '</button>';
    setApp(html);
    table = document.createElement('table');
    table.className = 'word';
    tbody = document.createElement('tbody');
    tr = document.createElement('tr');
    col = 0;
    for (i = 0; i < secret.length; i++) {
      if (col === 8) {
        tbody.appendChild(tr);
        tr = document.createElement('tr');
        col = 0;
      }
      td = document.createElement('td');
      tr.appendChild(td);
      cells.push(td);
      col += 1;
      paintCell(i);
    }
    tbody.appendChild(tr);
    table.appendChild(tbody);
    byId('wordwrap').appendChild(table);
    var buttons = document.getElementById('app').getElementsByTagName('button');
    for (i = 0; i < buttons.length; i++) {
      if (buttons[i].getAttribute('data-l')) {
        buttons[i].onclick = function (ev) {
          var t = ev.target || ev.srcElement;
          guess(t.getAttribute('data-l'));
        };
      }
    }
    byId('menu').onclick = function () {
      secret = '';
      showHome();
    };
    paintFigure();
    paintMiss();
  }

  function paintCell(i) {
    if (!cells[i]) return;
    cells[i].textContent = revealed[i] ? secret.charAt(i) : '';
  }

  function paintFigure() {
    var el = byId('fig');
    if (el) el.innerHTML = gallowsHtml(mistakes);
  }

  function paintMiss() {
    var el = byId('miss');
    if (el) el.textContent = L().mistakes + ' ' + mistakes + '/' + MAX;
  }

  function markKey(letter, hit) {
    var buttons = document.getElementById('app').getElementsByTagName('button');
    var i;
    for (i = 0; i < buttons.length; i++) {
      if (buttons[i].getAttribute('data-l') === letter) {
        buttons[i].className = hit ? 'on' : 'on';
      }
    }
  }

  function guess(letter) {
    var i, hit, done;
    if (view !== 'game' || !letter) return;
    letter = trUpper(letter);
    if (keyAlphabet().indexOf(letter) < 0) return;
    if (guessed[letter]) return;
    guessed[letter] = 1;
    hit = 0;
    for (i = 0; i < secret.length; i++) {
      if (secret.charAt(i) === letter) {
        revealed[i] = 1;
        hit = 1;
        paintCell(i);
      }
    }
    markKey(letter, hit);
    if (!hit) {
      mistakes += 1;
      paintFigure();
      paintMiss();
    }
    done = 1;
    for (i = 0; i < revealed.length; i++) {
      if (!revealed[i]) done = 0;
    }
    if (done) showEnd(1);
    else if (mistakes >= MAX) showEnd(0);
  }

  function showEnd(won) {
    var lang = L();
    var html = '';
    var shown = secret;
    view = 'end';
    secret = '';
    html += '<h1>' + (won ? lang.win : lang.lose) + '</h1>';
    if (!won) html += gallowsHtml(mistakes);
    html += '<div class="block"><div class="meta">' + lang.theWord + '</div><div class="big">' + shown + '</div></div>';
    html += '<p class="meta">' + lang.mistakes + ' ' + mistakes + '/' + MAX + '</p>';
    html += '<button type="button" id="again">' + lang.again + '</button>';
    html += '<button type="button" id="home">' + lang.home + '</button>';
    setApp(html);
    byId('again').onclick = showWord;
    byId('home').onclick = showHome;
  }

  function eat(e) {
    if (e.preventDefault) e.preventDefault();
  }

  function onKey(e) {
    var ch, code;
    code = e.keyCode || e.which || 0;
    if (view === 'word' && (code === 13 || e.key === 'Enter')) {
      eat(e);
      submitWord();
      return;
    }
    if (view !== 'game') return;
    ch = e.key || '';
    if (!ch || ch.length !== 1) return;
    eat(e);
    guess(ch);
  }

  function prepareOffline() {
    if (offlineBound) return;
    offlineBound = true;
    if (!navigator.serviceWorker) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    try {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        var node = byId('offline');
        if (node) node.textContent = offlineText();
      });
    } catch (e4) {}
    navigator.serviceWorker.register('sw.js')['catch'](function () {});
  }

  function main() {
    load();
    document.onkeydown = onKey;
    prepareOffline();
    showHome();
  }

  main();
})();
</script>
</body>
</html>
